<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="welcome-screen">
    <div class="welcome-content">
        <h1>UNO</h1>
    </div>
    <div class="welcome-buttons">
        <button id="singleplayer-btn" class="welcome-button">Singleplayer</button>
    </div>
</main>

<div id="player-setup-modal" class="hidden modal-bg">
    <div class="modal">
        <h2>Configura los jugadores</h2>
        <form id="player-setup-form">
            <div id="player-inputs"></div>
            <button type="submit" class="welcome-button">Comenzar partida</button>
            <button type="button" id="cancel-setup" class="welcome-button">Cancelar</button>
        </form>
    </div>
</div>

<main id="game-board" class="hidden">
    <section id="opponents-row">
        <div class="opponent-area" id="opponent-area-1"></div>
        <div class="opponent-area" id="opponent-area-2"></div>
        <div class="opponent-area" id="opponent-area-3"></div>
    </section>
    <section class="center-area">
        <div id="deck" class="card-pile">
        </div>
        <div id="discard-pile" class="card-pile"></div>
        <div id="turn-indicator" class="turn-indicator"></div>
    </section>
    <section class="player-area" id="player-area">
        <div class="player-info">
            <span id="player-name"></span>
            <button id="uno-button">UNO</button>
            <button id="draw-button">Robar Carta</button>
            <button id="restart-game-btn" class="welcome-button">Reiniciar Juego</button>
        </div>
    </section>
</main>

<div id="victory-modal" class="modal-bg hidden">
    <div class="modal">
        <h2 id="victory-message">¡Victoria!</h2>
        <button id="play-again-btn" class="welcome-button">Jugar de nuevo</button>
    </div>
</div>

<div id="color-selector" class="hidden"></div>

<div id="cpu-notification" class="cpu-notification hidden">
    <div class="notification-content">
        <span id="notification-text"></span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
